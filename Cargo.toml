[package]
name = "cel-playground"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "CEL expressions evaluated by cel-rust, compiled to WebAssembly, in the browser"
repository = "https://github.com/cel-rust/playground"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Each version of cel the playground offers: `cel-0-N`, of the 0.N line, which
# the feature of the same name builds with (see src/lib.rs and versions.sh)
cel-0-15 = { package = "cel", version = "0.15.0", optional = true }
cel-0-16 = { package = "cel", version = "0.16.0", optional = true }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
serde_json = "1"

# Exactly one version of cel per build; the newest by default
[features]
default = ["cel-0-16"]
cel-0-15 = ["dep:cel-0-15"]
cel-0-16 = ["dep:cel-0-16"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
